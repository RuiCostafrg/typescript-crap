version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers: [RuiCostafrg]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers: [RuiCostafrg]
  - package-ecosystem: npm
    directory: /tests/tooling
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers: [RuiCostafrg]
  - package-ecosystem: npm
    directory: /tests/fixtures/frameworks
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers: [RuiCostafrg]
    ignore:
      # ts-jest 29.4.15 requires typescript < 7; drop this once ts-jest supports 7.
      - dependency-name: typescript
        versions: [">=7"]
