name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.repository == 'RuiCostafrg/typescript-crap' && github.actor_id == '35194998'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.90", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Python helper and release security regression tests
        run: python3 -B -m unittest discover -s tests -p "test_*.py"
      - run: cargo fmt --check
      - name: Check publishable package contents
        shell: bash
        run: |
          cargo package --list > /tmp/package-contents.txt
          if grep -E '^(reports|coverage|target)/|(^|/)__pycache__/|\.py[co]$' /tmp/package-contents.txt; then
            echo 'Generated/private artifacts must not be packaged.' >&2
            exit 1
          fi
      - name: Strict Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Debug tests
        run: cargo test --locked
      - name: Installed coverage helper bundle (Node 24)
        run: |
          python3 scripts/bundle-coverage.py target/helper-bundle
          python3 scripts/verify-coverage-bundle.py --archive target/helper-bundle/ts-crap-coverage-helpers.zip --scanner target/debug/ts-crap
      - name: Release tests
        run: cargo test --locked --release
      - name: Rust documentation
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: node --check scripts/coverage.mjs && node --check scripts/coverage-lines.mjs && node --check scripts/coverage-hook.mjs && node --check scripts/import-coverage.mjs
  platform-behavior:
    if: github.repository == 'RuiCostafrg/typescript-crap' && github.actor_id == '35194998'
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.90"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Paths, Git selection, reports and real Node coverage
        run: cargo test --locked --test cli --test git_diff --test reports --test coverage_e2e --test adoption --test coverage_import --test example
      - name: Installed coverage helper bundle (Node 24)
        shell: bash
        run: |
          python3 scripts/bundle-coverage.py target/helper-bundle
          scanner=target/debug/ts-crap
          if [[ "$RUNNER_OS" == Windows ]]; then scanner="$scanner.exe"; fi
          python3 scripts/verify-coverage-bundle.py --archive target/helper-bundle/ts-crap-coverage-helpers.zip --scanner "$scanner"
  audit:
    if: github.repository == 'RuiCostafrg/typescript-crap' && github.actor_id == '35194998'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --deny warnings
  workflows:
    if: github.repository == 'RuiCostafrg/typescript-crap' && github.actor_id == '35194998'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: actionlint
