# TEMPORARY (D0): per-step timing of the Action's install path on hosted
# runners. Deleted before the PR merges; the numbers go to docs/measurements/.
name: D0 install timing
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d0-install-timing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    if: github.repository == 'RuiCostafrg/typescript-crap' && github.actor_id == '35194998'
    timeout-minutes: 30
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, macos-26, windows-2022]
        round: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Time each install step
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MEASURE_RUNNER: ${{ matrix.runner }}
          MEASURE_ITERATIONS: '5'
          ROUND: ${{ matrix.round }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            MEASURE_BASH=$(cygpath -w "$(command -v bash)")
            python=python
          else
            MEASURE_BASH=$(command -v bash)
            python=python3
          fi
          export MEASURE_BASH
          ls -la "${XDG_CACHE_HOME:-$HOME/.cache}/gh" 2>/dev/null || echo "no gh cache at job start"
          "$python" -I .github/d0/measure_install.py "$RUNNER_TEMP/d0-$MEASURE_RUNNER-$ROUND.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d0-${{ matrix.runner }}-${{ matrix.round }}
          path: ${{ runner.temp }}/d0-${{ matrix.runner }}-${{ matrix.round }}.json
  binary-size:
    # D2: real dist-profile sizes before (strip = "debuginfo") and after.
    if: github.repository == 'RuiCostafrg/typescript-crap' && github.actor_id == '35194998'
    timeout-minutes: 40
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-26
            target: aarch64-apple-darwin
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.90.0'
          targets: ${{ matrix.target }}
      - name: Native musl compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
      - name: Build and pack before and after
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          pack() {
            local label=$1 stage="$RUNNER_TEMP/$1/ts-crap-$TARGET"
            mkdir -p "$stage"
            cp "target/$TARGET/dist/ts-crap" LICENSE README.md CHANGELOG.md "$stage/"
            if [[ "$TARGET" == *linux* ]]; then cp packaging/licenses/musl-COPYRIGHT "$stage/"; fi
            tar -cJf "$RUNNER_TEMP/$label.tar.xz" -C "$RUNNER_TEMP/$label" "ts-crap-$TARGET"
            binary=$(wc -c < "target/$TARGET/dist/ts-crap" | tr -d ' ')
            archive=$(wc -c < "$RUNNER_TEMP/$label.tar.xz" | tr -d ' ')
            version=$("target/$TARGET/dist/ts-crap" --version)
            echo "$TARGET $label binary=$binary archive=$archive version='$version'" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          CARGO_PROFILE_DIST_STRIP=debuginfo cargo build --locked --profile dist --target "$TARGET"
          pack before
          if [[ "$RUNNER_OS" == Linux ]]; then readelf -S --wide "target/$TARGET/dist/ts-crap" | grep -E 'symtab|strtab' || true; fi
          cargo build --locked --profile dist --target "$TARGET"
          pack after
          if [[ "$RUNNER_OS" == Linux ]]; then readelf -S --wide "target/$TARGET/dist/ts-crap" | grep -E 'symtab|strtab' || true; fi
