# TEMPORARY: exercises the real verify-release.yml before any tag exists, with
# the published v2.4.0 assets standing in for a release candidate. Removed
# before this PR merges.
name: Dry-run release verification
on:
  pull_request:
    paths: [.github/workflows/verify-release.yml, .github/workflows/dry-run-verify-release.yml]
permissions:
  contents: read
jobs:
  assets:
    if: github.repository == 'RuiCostafrg/typescript-crap' && github.actor_id == '35194998'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Download the published v2.4.0 release as the candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v2.4.0 --repo "$GITHUB_REPOSITORY" --dir release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets
  verify:
    needs: assets
    uses: ./.github/workflows/verify-release.yml
    with:
      plan: '{"releases":[{"app_version":"2.4.0"}]}'
