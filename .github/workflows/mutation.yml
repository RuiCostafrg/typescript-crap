name: Rust mutation tests
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: mutations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mutants:
    if: github.repository == 'RuiCostafrg/typescript-crap' && github.actor_id == '35194998'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Run all production mutations
        id: mutations
        shell: bash
        run: |
          set +e
          python3 scripts/time-command.py --label full-mutations --output reports/mutation-timings.jsonl -- cargo mutants -j 2 --jobserver-tasks 2 --timeout 60 --build-timeout 180
          status=$?
          # Exit 2 means survivors; the explicit score gate decides their impact.
          # All other failures (including baseline/build infrastructure) stay fatal.
          if [[ "$status" != 0 && "$status" != 2 ]]; then exit "$status"; fi
      - name: Require at least 90 percent assertion-killed mutations
        if: ${{ always() && steps.mutations.outcome != 'skipped' }}
        run: python3 scripts/mutation-score.py mutants.out/outcomes.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-results
          path: |
            mutants.out/
            reports/mutation-timings.jsonl
          if-no-files-found: warn
          retention-days: 14
