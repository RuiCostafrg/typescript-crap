name: Rust mutation tests
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: mutations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shard:
    name: mutants shard ${{ matrix.shard }}/4
    if: github.repository == 'RuiCostafrg/typescript-crap' && github.actor_id == '35194998'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Run one shard of the production mutations
        id: mutations
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set +e
          cargo mutants -j 2 --jobserver-tasks 2 --timeout 60 --build-timeout 180 \
            --shard "$SHARD/4" --sharding round-robin
          status=$?
          # Exit 2 means survivors; the combined score gate decides their impact.
          # All other failures (including baseline/build infrastructure) stay fatal.
          if [[ "$status" != 0 && "$status" != 2 ]]; then exit "$status"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-results-${{ matrix.shard }}
          path: mutants.out/
          if-no-files-found: warn
          retention-days: 14
  # Required check: scores the union of all shards against the full mutant list.
  mutants:
    needs: shard
    if: always() && github.repository == 'RuiCostafrg/typescript-crap' && github.actor_id == '35194998'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require every shard to finish
        env:
          SHARDS: ${{ needs.shard.result }}
        run: test "$SHARDS" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-mutants@27.1.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-results-*
          path: shards
      - name: Require at least 90 percent assertion-killed mutations across all shards
        shell: bash
        run: |
          cargo mutants --list --json > mutants-list.json
          python3 scripts/mutation-score.py --expected mutants-list.json \
            shards/mutation-results-{0,1,2,3}/outcomes.json
