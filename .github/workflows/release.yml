# Hand-maintained security boundary. cargo-dist packages artifacts but does not
# generate this workflow; see dist-workspace.toml and SECURITY.md.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    if: >-
      github.repository == 'RuiCostafrg/typescript-crap' &&
      github.actor_id == '35194998' &&
      (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      manifest: ${{ steps.plan.outputs.manifest }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate source and successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [[ "$EVENT" == push ]]; then
            [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            for workflow in ci.yml coverage.yml mutation.yml installation.yml; do
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push" \
                --jq '[.workflow_runs[] | select(.head_branch == "main")] | sort_by(.run_number, .run_attempt) | last | .conclusion == "success"' | grep -Fx true
            done
          fi
      - name: Install checksum-pinned cargo-dist
        run: python3 scripts/install-dist.py x86_64-unknown-linux-gnu
      - name: Plan without publishing
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT" == push ]]; then
            dist plan --tag "$REF_NAME" --output-format=json > plan.json
          else
            dist plan --output-format=json > plan.json
          fi
          echo "manifest=$(jq -c . plan.json)" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r .announcement_tag plan.json)" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.target }}
      - name: Install checksum-pinned cargo-dist
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/install-dist.py "$TARGET"
        shell: bash
      - name: Build locked release archives
        id: build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          cargo fetch --locked
          CARGO_NET_OFFLINE=true dist build --tag "$TAG" --artifacts=local --target "$TARGET" --output-format=json > dist-manifest.json
          git diff --exit-code -- Cargo.lock
          cp dist-manifest.json "target/distrib/$TARGET-dist-manifest.json"
          {
            echo 'paths<<EOF'
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: |
            ${{ steps.build.outputs.paths }}
            target/distrib/${{ matrix.target }}-dist-manifest.json
          if-no-files-found: error
          retention-days: 7
  verify:
    needs: [plan, build, assemble]
    uses: ./.github/workflows/verify-release.yml
    with:
      plan: ${{ needs.plan.outputs.manifest }}
  assemble:
    needs: [plan, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned cargo-dist
        run: python3 scripts/install-dist.py x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-local-*
          path: target/distrib
          merge-multiple: true
      - name: Assemble release assets
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          cargo fetch --locked
          CARGO_NET_OFFLINE=true dist build --tag "$TAG" --artifacts=global --output-format=json > assembled-manifest.json
          git diff --exit-code -- Cargo.lock
          cp assembled-manifest.json target/distrib/dist-manifest.json
          python3 scripts/bundle-coverage.py target/distrib
          python3 scripts/prepare-release.py target/distrib release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [plan, assemble, verify]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # No checkout, compiled binary, downloaded script, or cargo-dist runs in
      # this job. Artifacts remain data, on a fresh runner, after owner approval.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-assets/*
          create-storage-record: false
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "ts-crap $TAG" --generate-notes "${flags[@]}" release-assets/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
