name: Verify published adoption
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published release version without v (must contain helpers)
        type: string
        required: true
      verify-guide:
        description: Verify installed helpers (disable only for old releases predating helpers)
        type: boolean
        default: true
      previous-version:
        description: Distinct previous published upgrade fixture without v
        type: string
        required: true
permissions:
  contents: read
jobs:
  installed-guide:
    if: inputs.verify-guide && github.repository == 'RuiCostafrg/typescript-crap' && github.actor_id == '35194998'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            target: x86_64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Download published CLI, helpers, checksums and provenance
        id: assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          assets_dir=$(mktemp -d "$RUNNER_TEMP/ts-crap-published.XXXXXX")
          echo "path=$assets_dir" >> "$GITHUB_OUTPUT"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "ts-crap-$TARGET.*" --pattern 'ts-crap-coverage-helpers.zip*' --dir "$assets_dir"
          for asset in "$assets_dir"/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/v$VERSION" --deny-self-hosted-runners
          done
      - name: Verify installed tools in a separate clean project
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSETS_DIR: ${{ steps.assets.outputs.path }}
        run: |
          unpack_dir=$(mktemp -d "$RUNNER_TEMP/ts-crap-unpacked.XXXXXX")
          cd "$ASSETS_DIR"
          if [[ "$TARGET" == *windows* ]]; then
            sha256sum --check "ts-crap-$TARGET.zip.sha256"
            unzip -q "ts-crap-$TARGET.zip" -d "$unpack_dir"
            binary=ts-crap.exe
          else
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum --check "ts-crap-$TARGET.tar.xz.sha256"
            else
              shasum -a 256 --check "ts-crap-$TARGET.tar.xz.sha256"
            fi
            tar -xf "ts-crap-$TARGET.tar.xz" -C "$unpack_dir"
            binary=ts-crap
          fi
          cd "$GITHUB_WORKSPACE"
          executable=$(find "$unpack_dir" -type f -name "$binary")
          python3 scripts/verify-ci-guide.py --archive "$ASSETS_DIR/ts-crap-coverage-helpers.zip" --scanner "$executable" --output guide-reports
          if [[ "$TARGET" == x86_64-unknown-linux-gnu ]]; then
            npm ci --ignore-scripts --no-audit --no-fund --prefix tests/tooling
            python3 scripts/verify-ci-guide.py --archive "$ASSETS_DIR/ts-crap-coverage-helpers.zip" --scanner "$executable" --vitest tests/tooling/node_modules/vitest/vitest.mjs --output guide-reports
          fi
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-guide-${{ matrix.target }}
          path: guide-reports/
          if-no-files-found: warn
          retention-days: 14
  live-homebrew:
    if: github.repository == 'RuiCostafrg/typescript-crap' && github.actor_id == '35194998'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the live tap and published upgrade
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PREVIOUS: ${{ inputs.previous-version }}
          TARGET: ${{ matrix.target }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$PREVIOUS" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$VERSION" != "$PREVIOUS" ]]
          if [[ "$RUNNER_OS" == Linux ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          for version in "$PREVIOUS" "$VERSION"; do
            gh release download "v$version" --repo "$GITHUB_REPOSITORY" \
              --pattern "ts-crap-$TARGET.*" --pattern ts-crap.rb --dir "assets/$version"
            gh attestation verify "assets/$version/ts-crap.rb" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/v$version" --deny-self-hosted-runners
          done
          python3 scripts/verify-live-homebrew.py --assets "assets/$VERSION" --version "$VERSION" \
            --previous-assets "assets/$PREVIOUS" --previous-version "$PREVIOUS" --target "$TARGET"
