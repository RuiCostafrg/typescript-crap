name: Verify release archives
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
permissions:
  contents: read
jobs:
  smoke:
    name: Smoke test (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: artifacts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify checksum, unpack, and run
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ fromJson(inputs.plan).releases[0].app_version }}
        run: |
          cd artifacts
          if [[ "$TARGET" == *windows* ]]; then
            archive="ts-crap-$TARGET.zip"
            binary=ts-crap.exe
          else
            archive="ts-crap-$TARGET.tar.xz"
            binary=ts-crap
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --check "$archive.sha256"
          else
            shasum -a 256 --check "$archive.sha256"
          fi
          mkdir unpacked
          if [[ "$archive" == *.zip ]]; then
            unzip "$archive" -d unpacked
          else
            tar -xf "$archive" -C unpacked
          fi
          executable=$(find "$PWD/unpacked" -type f -name "$binary")
          test -n "$executable"
          "$executable" --version | grep -Fx "ts-crap $VERSION"
          "$executable" --help
          # A real scan must work with the packaged parser and no Rust/Node calls.
          "$executable" --root "$GITHUB_WORKSPACE/examples/shop" --threshold 20
          python3 "$GITHUB_WORKSPACE/scripts/verify-coverage-bundle.py" \
            --archive "$PWD/ts-crap-coverage-helpers.zip" --scanner "$executable"
          python3 "$GITHUB_WORKSPACE/scripts/verify-ci-guide.py" \
            --archive "$PWD/ts-crap-coverage-helpers.zip" --scanner "$executable"
          if [[ "$TARGET" == *linux* ]]; then
            docker run --rm --network none \
              --mount "type=bind,src=$executable,dst=/usr/local/bin/ts-crap,readonly" \
              --mount "type=bind,src=$GITHUB_WORKSPACE/examples/shop,dst=/project,readonly" \
              ubuntu:26.04 /bin/sh -ec \
              'getconf GNU_LIBC_VERSION; ts-crap --version; ts-crap --help >/dev/null; ts-crap --root /project --threshold 20'
          fi
      - name: Verify generated installer and upgrade before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ fromJson(inputs.plan).releases[0].app_version }}
        run: |
          installer=shell
          if [[ "$TARGET" == *windows* ]]; then installer=powershell; fi
          gh release download v2.0.1 --repo "$GITHUB_REPOSITORY" \
            --pattern "ts-crap-$TARGET.*" --pattern ts-crap-installer.sh \
            --pattern ts-crap-installer.ps1 --dir previous-assets
          python3 scripts/verify-installation.py --assets artifacts --version "$VERSION" \
            --previous-assets previous-assets --previous-version 2.0.1 \
            --target "$TARGET" --installer "$installer"
  homebrew:
    name: Homebrew (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: artifacts
      - name: Verify generated formula install and upgrade before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ fromJson(inputs.plan).releases[0].app_version }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          gh release download v2.0.1 --repo "$GITHUB_REPOSITORY" \
            --pattern "ts-crap-$TARGET.*" --pattern ts-crap.rb --dir previous-assets
          python3 scripts/verify-installation.py --assets artifacts --version "$VERSION" \
            --previous-assets previous-assets --previous-version 2.0.1 \
            --target "$TARGET" --installer homebrew
