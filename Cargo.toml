[package]
name = "ts-crap"
version = "2.1.0"
edition = "2024"
rust-version = "1.90"
description = "Source-aware CRAP scores for TypeScript functions"
license = "MIT"
repository = "https://github.com/RuiCostafrg/typescript-crap"
homepage = "https://github.com/RuiCostafrg/typescript-crap"
readme = "README.md"
# An explicit allowlist prevents local reports, mutation logs and caches shipping.
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/LICENSE*",
    "/assets/icon.svg",
    "/docs/COVERAGE_HELPERS.md",
    "/docs/COMPATIBILITY.md",
    "/docs/VERIFICATION.md",
    "/docs/MIGRATING_TO_V1.md",
    "/docs/MIGRATING_TO_V2.md",
    "/docs/CI_ADOPTION.md",
    "/tests/tooling/package*.json",
    "/tests/adoption/*.json",
    "/schemas/**",
    "/scripts/*.py",
    "/scripts/*.mjs",
    "/scripts/*.sh",
    "/examples/**",
    "/tests/*.rs",
    "/tests/common/**",
    "/tests/*.test.mjs",
    "/tests/fixtures/**",
    "/tests/test_*.py",
    "/benches/*.rs",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
same-file = "1"
tempfile = "3"
tree-sitter = "0.27"
tree-sitter-typescript = "0.23"

[dev-dependencies]
quick-xml = "0.42"

[[bench]]
name = "scan"
harness = false

[[bench]]
name = "review"
harness = false

[[bench]]
name = "committed"
harness = false

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
exit = "deny"
format_push_string = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true
strip = "debuginfo"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
