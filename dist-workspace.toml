[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# A GitHub repo to push Homebrew formulas to
tap = "RuiCostafrg/homebrew-tap"
# Post-announce jobs to run in CI
# The release workflow is hand-maintained to isolate build and publishing tokens.
allow-dirty = ["ci"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Generate and dist a source tarball
source-tarball = false
# Whether to install an updater program
install-updater = false

[dist.github-custom-runners]
aarch64-apple-darwin = "macos-26"
x86_64-apple-darwin = "macos-26-intel"
aarch64-unknown-linux-gnu = "ubuntu-26.04-arm"
x86_64-unknown-linux-gnu = "ubuntu-26.04"

# Keep generated workflows pinned like the existing CI workflows.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333"
