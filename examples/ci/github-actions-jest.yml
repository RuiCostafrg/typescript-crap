# Jest variant of github-actions.yml, collecting with the one-step coverage-run.mjs.
# Copy into .github/workflows/crap.yml after reviewing docs/JEST.md and docs/CI_ADOPTION.md.
# Trust model: collection runs the PR's own test code in this job, before the
# gate, with write access to the workspace, the downloaded tools and the reviewed
# policy/baseline copies. Use it for trusted contributors. For untrusted PRs
# (forks), collect in one job and gate in a fresh job: clean checkout of the
# PR head, separately verified tools, policy and baseline from BASE_SHA, and only
# the native coverage file passed between them. See docs/CI_ADOPTION.md.
name: TypeScript CRAP gate (Jest)
on: pull_request
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      # coverage-run.mjs ships in the helper bundle from 2.3.0 on.
      TS_CRAP_VERSION: '2.3.2'
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install reviewed CLI and matching helpers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install_dir=$(mktemp -d "$RUNNER_TEMP/ts-crap-tools.XXXXXX")
          gh release download "v$TS_CRAP_VERSION" --repo RuiCostafrg/typescript-crap \
            --pattern 'ts-crap-x86_64-unknown-linux-gnu.tar.xz*' \
            --pattern 'ts-crap-coverage-helpers.zip*' --dir "$install_dir"
          cd "$install_dir"
          sha256sum --check ts-crap-x86_64-unknown-linux-gnu.tar.xz.sha256
          sha256sum --check ts-crap-coverage-helpers.zip.sha256
          tar -xf ts-crap-x86_64-unknown-linux-gnu.tar.xz
          unzip -q ts-crap-coverage-helpers.zip
          executable=$(find "$install_dir" -type f -name ts-crap)
          test "$("$executable" --version)" = "ts-crap $TS_CRAP_VERSION"
          echo "$(dirname "$executable")" >> "$GITHUB_PATH"
          echo "TS_CRAP_HELPERS=$install_dir/ts-crap-coverage-helpers" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Collect fresh coverage and gate with reviewed policy
        run: |
          run_dir=$(mktemp -d "$RUNNER_TEMP/ts-crap-run.XXXXXX")
          echo "TS_CRAP_RUN_DIR=$run_dir" >> "$GITHUB_ENV"
          git show "$BASE_SHA:ts-crap.json" > "$run_dir/reviewed-policy.json"
          git show "$BASE_SHA:crap-baseline.json" > "$run_dir/reviewed-baseline.json"
          # Adds --coverage, the JSON reporter and a fresh private reports directory.
          node "$TS_CRAP_HELPERS/coverage-run.mjs" --framework jest --provider babel \
            --format json --root . --output "$run_dir/native.json" -- --runInBand
          set +e
          ts-crap --root . --config "$run_dir/reviewed-policy.json" \
            --coverage "$run_dir/native.json" --baseline "$run_dir/reviewed-baseline.json" \
            --diff "$BASE_SHA" --format json --output "$run_dir/crap.json"
          json_status=$?
          ts-crap --root . --config "$run_dir/reviewed-policy.json" \
            --coverage "$run_dir/native.json" --baseline "$run_dir/reviewed-baseline.json" \
            --diff "$BASE_SHA" --format sarif --output "$run_dir/crap.sarif"
          sarif_status=$?
          set -e
          if (( json_status > 1 || sarif_status > 1 )); then exit 2; fi
          if (( json_status == 1 || sarif_status == 1 )); then exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: crap-reports
          path: ${{ env.TS_CRAP_RUN_DIR }}
          if-no-files-found: warn
          retention-days: 14
